server {
    server_name xiaoyulaile.online www.xiaoyulaile.online;


    # ????????
    # HSTS?????????? https???? http ?????????????
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 600M;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    # 服务重启瞬间的兜底：显示友好维护页，而不是浏览器 502 错误
    error_page 502 503 504 =503 /maintenance.html;
    location = /maintenance.html {
        internal;
        root /opt/xiaoyu-laile/public;
        add_header Cache-Control "no-store" always;
    }

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;

        # 后端短暂不可用时尽快失败，交给维护页接手
        proxy_connect_timeout 3s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/xiaoyulaile.online/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/xiaoyulaile.online/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    if ($host = www.xiaoyulaile.online) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = xiaoyulaile.online) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name xiaoyulaile.online www.xiaoyulaile.online;
    return 404; # managed by Certbot




}