<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<title>小鱼来了 · 网站备案中</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: linear-gradient(160deg, #f3f8ff 0%, #eef4fb 100%);
    color: #16202e;
    padding: 32px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  .box {
    width: 100%;
    max-width: 560px;
    background: #fff;
    border-radius: 20px;
    padding: 40px 32px 32px;
    box-shadow: 0 12px 40px rgba(22, 32, 46, .09);
    text-align: center;
  }

  .logo {
    width: 84px;
    height: 84px;
    border-radius: 22px;
    display: block;
    margin: 0 auto;
    box-shadow: 0 8px 20px rgba(28, 96, 214, .18);
  }

  h1 {
    margin-top: 20px;
    font-size: 24px;
    font-weight: 800;
    letter-spacing: .5px;
  }

  .sub {
    margin-top: 8px;
    font-size: 13px;
    color: #7b8798;
    letter-spacing: 1px;
  }

  .card {
    margin-top: 26px;
    background: #f7fbff;
    border: 1px solid #e2ecf9;
    border-radius: 14px;
    padding: 18px 18px 16px;
    text-align: left;
  }

  .row {
    display: flex;
    gap: 12px;
    padding: 9px 0;
    font-size: 13.5px;
    line-height: 1.6;
    border-bottom: 1px dashed #e6eef8;
  }
  .row:last-child { border-bottom: none; }

  .k {
    flex: none;
    width: 76px;
    color: #7b8798;
  }
  .v {
    flex: 1;
    color: #16202e;
    font-weight: 600;
    word-break: break-all;
  }

  .badge {
    display: inline-block;
    background: #fff4e5;
    color: #b26a00;
    border: 1px solid #ffe0b2;
    border-radius: 999px;
    padding: 2px 10px;
    font-size: 12px;
    font-weight: 700;
  }

  .note {
    margin-top: 22px;
    font-size: 12.5px;
    line-height: 1.85;
    color: #6b7789;
    text-align: left;
  }

  .contact {
    margin-top: 22px;
    padding-top: 20px;
    border-top: 1px solid #eef2f7;
    font-size: 13px;
    color: #4a5566;
    line-height: 1.9;
  }
  .contact b { color: #16202e; }

  .foot {
    margin-top: 28px;
    font-size: 11.5px;
    color: #9aa6b6;
    line-height: 1.8;
  }
  .foot a { color: #9aa6b6; text-decoration: none; }
  .foot a:hover { text-decoration: underline; }

  @media (max-width: 480px) {
    .box { padding: 32px 22px 26px; border-radius: 16px; }
    h1 { font-size: 21px; }
    .k { width: 68px; font-size: 13px; }
    .row { font-size: 13px; }
  }
</style>
</head>
<body>
  <div class="box">
    <img class="logo" src="/static/icon-192.png" alt="小鱼来了" onerror="this.style.display='none'">

    <h1>小鱼来了</h1>
    <div class="sub">找项目 · 投资 · 产业</div>

    <div style="margin-top:18px"><span class="badge">⏳ 网站备案进行中</span></div>

    <div class="card">
      <div class="row">
        <span class="k">网站名称</span>
        <span class="v">小鱼来了</span>
      </div>
      <div class="row">
        <span class="k">主办单位</span>
        <span class="v">授渔算法（上海）科技有限公司</span>
      </div>
      <div class="row">
        <span class="k">网站域名</span>
        <span class="v">xiaoyulaile.online</span>
      </div>
      <div class="row">
        <span class="k">当前状态</span>
        <span class="v">ICP 备案审核中</span>
      </div>
    </div>

    <div class="note">
      本站正在进行工信部 ICP 备案。根据《互联网信息服务管理办法》，
      备案完成前暂不提供信息发布与交易服务。<br>
      备案通过后本站将立即恢复访问，感谢你的耐心等待。
    </div>

    <div class="contact">
      备案相关事宜请联系：<br>
      <b>卢云</b> · <b>134 5669 3544</b><br>
      <b>luyun@shouyu.com</b>
    </div>

    <div class="foot">
      本站已在工信部 ICP/IP 地址/域名信息备案管理系统提交申请<br>
      <a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener noreferrer">beian.miit.gov.cn</a>
    </div>
  </div>
</body>
</html>
