<!-- 微信内置浏览器提示：微信不支持「添加到主屏幕」，引导用户转到外部浏览器 -->
<div id="wx-tip" style="display:none;position:fixed;left:10px;right:10px;bottom:18px;z-index:99999;background:#0b74ff;color:#fff;padding:12px 46px 12px 16px;border-radius:12px;font-size:13px;line-height:1.6;box-shadow:0 6px 24px rgba(11,116,255,.35);">
  <div style="font-weight:700;margin-bottom:2px;">想要添加到手机桌面？</div>
  <div style="opacity:.92;">点右上角「···」→ 选择「在浏览器打开」，再添加到主屏幕</div>
  <div id="wx-tip-close" style="position:absolute;right:8px;top:8px;width:28px;height:28px;line-height:26px;text-align:center;font-size:20px;opacity:.75;cursor:pointer;">×</div>
</div>
<script>
(function () {
  try {
    if (!/MicroMessenger/i.test(navigator.userAgent)) return;
    var tip = document.getElementById('wx-tip');
    if (!tip) return;
    tip.style.display = 'block';
    var close = document.getElementById('wx-tip-close');
    if (close) {
      close.addEventListener('click', function () { tip.style.display = 'none'; });
    }
    setTimeout(function () { if (tip) tip.style.display = 'none'; }, 15000);
  } catch (e) {}
})();
</script>
<script type="module" src="/static/app.js"></script>
<script>
/* 注册 Service Worker —— 安卓 Chrome 判定"可安装"的硬性条件 */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('/sw.js', { scope: '/' }).catch(function () {});
  });
}
</script>
