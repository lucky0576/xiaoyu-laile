<div id="app"><div class="boot"><div class="boot-logo"><img src="/static/logo-fish.png" alt="" width="60" height="24"></div><div class="boot-text">小鱼来了</div><div class="boot-sub">正在加载…</div></div></div>

<div id="sheet-host"></div>

<!-- 微信内置浏览器提示：微信不支持「添加到主屏幕」，引导用户转到外部浏览器 -->
<div id="wx-tip" style="display:none;position:fixed;left:10px;right:10px;bottom:18px;z-index:99999;background:#0b74ff;color:#fff;padding:12px 46px 12px 16px;border-radius:12px;font-size:13px;line-height:1.6;box-shadow:0 6px 24px rgba(11,116,255,.35);">
  <div style="font-weight:700;margin-bottom:2px;">想要添加到手机桌面？</div>
  <div style="opacity:.92;">点右上角「···」→ 选择「在浏览器打开」，再添加到主屏幕</div>
  <div id="wx-tip-close" style="position:absolute;right:8px;top:8px;width:28px;height:28px;line-height:26px;text-align:center;font-size:20px;opacity:.75;cursor:pointer;">×</div>
</div>
<script>
(function () {
  try {
    if (!/MicroMessenger/i.test(navigator.userAgent)) return;
    var tip = document.getElementById('wx-tip');
    if (!tip) return;
    tip.style.display = 'block';
    var close = document.getElementById('wx-tip-close');
    if (close) {
      close.addEventListener('click', function () { tip.style.display = 'none'; });
    }
    setTimeout(function () { if (tip) tip.style.display = 'none'; }, 15000);
  } catch (e) {}
})();
</script>
<!-- 添加到桌面引导：装到桌面后，下次点图标直接全屏打开，不再经浏览器中转 -->
<div id="install-bar" style="display:none;position:fixed;left:10px;right:10px;bottom:78px;z-index:99998;background:#fff;color:#16202e;padding:12px 46px 12px 14px;border-radius:14px;font-size:13px;line-height:1.6;box-shadow:0 8px 28px rgba(24,60,120,.18);border:1px solid #e6edf7;">
  <div style="font-weight:800;margin-bottom:2px;">安装到桌面，打开更方便</div>
  <div style="color:#6b7c95;font-size:12px;">装好后点图标即开，不再出现浏览器提示</div>
  <div id="install-go" style="margin-top:10px;display:inline-block;background:#0b74ff;color:#fff;font-weight:700;font-size:13px;padding:7px 18px;border-radius:9px;cursor:pointer;">立即安装</div>
  <div id="install-close" style="position:absolute;right:6px;top:6px;width:30px;height:30px;line-height:28px;text-align:center;font-size:20px;color:#9aabc2;cursor:pointer;">×</div>
</div>
<script>
(function () {
  try {
    var isWeChat = /MicroMessenger/i.test(navigator.userAgent);
    var bar = document.getElementById('install-bar');
    var KEY = 'xyll_install_dismissed';
    if (!bar || isWeChat) return;                       // 微信内不支持安装，不打扰
    if (localStorage.getItem(KEY)) return;              // 用户已经关过
    if (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) return; // 已装

    var deferred = null;
    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();
      deferred = e;
      bar.style.display = 'block';
    });
    // iOS 没有 beforeinstallprompt，用 Safari 判断给出手动引导
    var isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);
    if (isIOS && !navigator.standalone) {
      setTimeout(function () { bar.style.display = 'block'; }, 2500);
      var go = document.getElementById('install-go');
      if (go) {
        go.textContent = '查看安装方法';
        go.addEventListener('click', function () {
          alert('点底部「分享」按钮 → 选择「添加到主屏幕」');
        });
      }
    }

    document.getElementById('install-close').addEventListener('click', function () {
      bar.style.display = 'none';
      localStorage.setItem(KEY, '1');
    });
    var btn = document.getElementById('install-go');
    if (btn) {
      btn.addEventListener('click', function () {
        if (!deferred) return;
        deferred.prompt();
        deferred.userChoice.finally(function () {
          deferred = null;
          bar.style.display = 'none';
          localStorage.setItem(KEY, '1');
        });
      });
    }
    window.addEventListener('appinstalled', function () {
      bar.style.display = 'none';
      localStorage.setItem(KEY, '1');
    });
  } catch (e) {}
})();
</script>
<script type="module" src="/static/app.js"></script>
<script>
/* 注册 Service Worker —— 安卓 Chrome 判定"可安装"的硬性条件
 *
 * 这里做三件事，保证用户永远拿到最新前端：
 *   1. updateViaCache:'none' —— sw.js 本身不走 HTTP 缓存，改完立刻生效
 *   2. 每次加载主动 registration.update() —— 有新 SW 就用新的
 *   3. 收到 SW 的 build-changed 消息 或 controllerchange 时自动刷新一次
 *      （用 sessionStorage 防死循环，一次会话最多刷一次）
 */
(function () {
  if (!('serviceWorker' in navigator)) return;

  var RELOAD_KEY = 'xyll_sw_reloaded';
  var reloading = false;

  function reloadOnce(reason) {
    if (reloading) return;
    if (sessionStorage.getItem(RELOAD_KEY) === '1') return;
    reloading = true;
    sessionStorage.setItem(RELOAD_KEY, '1');
    try { console.log('[sw] 检测到前端更新（' + reason + '），正在刷新…'); } catch (e) {}
    location.reload();
  }

  // SW 主动通知：服务端 build 变了
  navigator.serviceWorker.addEventListener('message', function (e) {
    if (e && e.data && e.data.type === 'build-changed') reloadOnce('build-changed');
  });

  // 新 SW 接管页面
  navigator.serviceWorker.addEventListener('controllerchange', function () {
    reloadOnce('controllerchange');
  });

  window.addEventListener('load', function () {
    navigator.serviceWorker
      .register('/sw.js', { scope: '/', updateViaCache: 'none' })
      .then(function (reg) {
        // 主动检查更新（Chrome 默认最多 24 小时才查一次，太慢了）
        try { reg.update(); } catch (e) {}
        // 页面从后台回到前台时再查一次
        document.addEventListener('visibilitychange', function () {
          if (document.visibilityState === 'visible') {
            try { reg.update(); } catch (e) {}
          }
        });
      })
      .catch(function () {});

    // 一次会话正常打开后清掉防刷标记，
    // 这样下次真正有更新时还能再刷一次
    setTimeout(function () {
      try { sessionStorage.removeItem(RELOAD_KEY); } catch (e) {}
    }, 15000);
  });
})();
</script>
</body>
