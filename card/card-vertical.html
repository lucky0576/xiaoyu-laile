<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; }
  body {
    font-family: "Microsoft YaHei", "微软雅黑", sans-serif;
    background: #fff;
    color: #1a1a1a;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  .card {
    width: 1080px;
    height: 1920px;
    background: #fff;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ================= 顶部：品牌区 ================= */
  .head {
    position: relative;
    height: 760px;
    background: linear-gradient(135deg, #0b74ff 0%, #19a0f0 48%, #12c7b4 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 0 80px;
    overflow: hidden;
  }
  /* 背景装饰圆 */
  .head::before,
  .head::after {
    content: '';
    position: absolute;
    border-radius: 50%;
    background: rgba(255, 255, 255, .08);
  }
  .head::before { width: 620px; height: 620px; right: -220px; top: -220px; }
  .head::after  { width: 420px; height: 420px; left: -160px; bottom: -180px; }

  .logo {
    position: relative;
    width: 216px;
    height: 216px;
    border-radius: 52px;
    box-shadow: 0 18px 44px rgba(4, 36, 88, .30);
    background: #fff;
  }

  .brand {
    position: relative;
    margin-top: 40px;
    font-size: 88px;
    font-weight: 800;
    letter-spacing: 8px;
    color: #fff;
    line-height: 1.1;
    text-shadow: 0 6px 22px rgba(4, 36, 88, .22);
    white-space: nowrap;
  }

  .brand-sub {
    position: relative;
    margin-top: 20px;
    font-size: 38px;
    font-weight: 600;
    letter-spacing: 10px;
    color: rgba(255, 255, 255, .94);
    white-space: nowrap;
  }

  /* ================= 中部：姓名 + 联系信息 ================= */
  .body {
    flex: 1;
    padding: 62px 88px 0;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .name {
    font-size: 96px;
    font-weight: 800;
    letter-spacing: 6px;
    color: #101820;
    line-height: 1.06;
    white-space: nowrap;
  }

  .title {
    margin-top: 18px;
    font-size: 38px;
    font-weight: 700;
    color: #2b2b2b;
    letter-spacing: 3px;
    white-space: nowrap;
  }

  .hr {
    width: 100%;
    height: 2px;
    background: #e8ebef;
    margin: 44px 0 40px;
  }

  .rows {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 28px;
  }
  .row { display: flex; align-items: flex-start; gap: 22px; }
  .k {
    width: 96px;
    flex: none;
    font-size: 32px;
    color: #6b7789;
    letter-spacing: 3px;
    line-height: 1.5;
  }
  .v {
    font-size: 38px;
    color: #14202e;
    font-weight: 700;
    letter-spacing: 1px;
    line-height: 1.42;
  }
  .v.small { font-size: 34px; font-weight: 600; }

  /* ================= 二维码 ================= */
  .qr-wrap {
    margin-top: 46px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }
  .qr {
    width: 268px;
    height: 268px;
    border: 2px solid #e8ebef;
    border-radius: 20px;
    padding: 10px;
    background: #fff;
    display: block;
    margin: 0 auto;
  }
  .qr-cap {
    font-size: 28px;
    line-height: 1.55;
    color: #5a6678;
    text-align: center;
    white-space: nowrap;
  }
  .qr-cap b { color: #0b74ff; }

  /* ================= 底部：专注行 ================= */
  .foot {
    padding: 34px 72px 46px;
    background: linear-gradient(180deg, #f7faff 0%, #eef7f6 100%);
    border-top: 2px solid #e8ebef;
  }
  .focus {
    font-family: "KaiTi", "楷体", "Microsoft YaHei", sans-serif;
    font-size: 31px;
    font-weight: 700;
    color: #e60012;
    letter-spacing: .4px;
    line-height: 1.66;
    text-align: center;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="head">
      <img class="logo" src="logo.png" alt="">
      <div class="brand">小鱼来了</div>
      <div class="brand-sub">AI 信息发布平台</div>
    </div>

    <div class="body">
      <div class="name">Lucas 卢</div>
      <div class="title">创始人 · 政府事务总监</div>

      <div class="hr"></div>

      <div class="rows">
        <div class="row">
          <span class="k">手机</span>
          <span class="v">134 5669 3544</span>
        </div>
        <div class="row">
          <span class="k">邮箱</span>
          <span class="v small">luyun@shouyu.com</span>
        </div>
        <div class="row">
          <span class="k">网址</span>
          <span class="v small">xiaoyulaile.online</span>
        </div>
        <div class="row">
          <span class="k">地址</span>
          <span class="v small">浙江省杭州市之江路 1300 号<br>钱塘银座 13 楼</span>
        </div>
      </div>

      <div class="qr-wrap">
        <img class="qr" src="qr.png" alt="">
        <div class="qr-cap">扫码进入 <b>小鱼来了</b> · 自动带上我的邀请码</div>
      </div>
    </div>

    <div class="foot">
      <div class="focus">
        找项目、投资、产业，小鱼来了<br>
        专注新能源（光伏、储能、风电、氢能等）、AI、飞行汽车、<br>
        机器人、低空经济、算力、投融资、园区、科技成果转化、酒店等
      </div>
    </div>
  </div>
</body>
</html>
