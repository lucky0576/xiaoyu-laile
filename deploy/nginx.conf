# ==========================================================================
# 小鱼来了 —— Nginx 反向代理示例（如果不想用 Caddy）
#
# HTTPS 证书推荐用 certbot 自动申请：
#   sudo apt install certbot python3-certbot-nginx
#   sudo certbot --nginx -d xiaoyu.example.com
#
# 放到 /etc/nginx/sites-available/xiaoyu-laile 并软链到 sites-enabled/
# ==========================================================================

upstream xiaoyu_app {
    server 127.0.0.1:8787;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name xiaoyu.example.com;

    # certbot 会在这里插入 301 跳转与证书配置
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name xiaoyu.example.com;

    ssl_certificate     /etc/letsencrypt/live/xiaoyu.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xiaoyu.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    # 支持 512MB 视频上传
    client_max_body_size 512m;
    client_body_timeout 600s;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    server_tokens off;

    location / {
        proxy_pass http://xiaoyu_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "";
        proxy_buffering off;   # SSE 实时推送需要
    }
}
